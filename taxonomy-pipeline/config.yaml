llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3.1:8b
  temperature: 0.3
  request_timeout: 600

pipeline1:
  pdf_dir: ./data/pdfs
  artifact_dir: ./data/artifacts
  checkpoint_dir: ./data/checkpoints
  flagged_dir: ./data/flagged

  extraction:
    min_quality_threshold: 0.3
    ocr_detection_threshold: 0.5

  cleaning:
    header_repeat_threshold: 0.5
    page_number_proximity: 20

  boundaries:
    chunk_size_tokens: 4000
    chunk_overlap_tokens: 500
    regex_min_sections: 5
    regex_min_coverage: 0.8

  enrichment:
    max_themes_per_section: 7
    max_passages_per_section: 3

  validation:
    min_confidence: 0.7
    max_gap_chars: 100

  batch:
    concurrency: 1
    checkpoint_every: 1
    retry_on_failure: 2

# Passage-level pipeline (src/pipeline2). Defaults are the local stack that scored best on the
# 8-book pilot (86/119 recall@10, 50/119 recall@1 with qwen3-embedding:4b; bge-m3 77/48, nomic 77/39).
# No local models? Set each provider to none, or run eval/route with --no-dense --no-rerank.
pipeline2:
  embed:
    provider: ollama          # ollama | openai | none
    base_url: http://localhost:11434
    model: qwen3-embedding:4b # ollama pull qwen3-embedding:4b
    query_prefix: "Instruct: Given a question, retrieve passages from books that answer it\nQuery: "
    doc_prefix: ""            # qwen3-embedding takes the instruction on queries only; changing this needs a re-embed
  gen:
    provider: ollama          # ollama | openai | none
    base_url: http://localhost:11434
    model: gemma4:12b         # ollama pull gemma4:12b
    temperature: 0.0
    think: false              # thinking models put JSON in the wrong field otherwise
  rerank:
    provider: http            # http | none; cross-encoder over the top fused candidates
    url: http://127.0.0.1:8088/rerank
    model: bge-reranker-v2-m3
    top: 30
  # OCR for image-only pages (not wired in yet): glm-ocr:q8_0 with num_ctx 16384
