<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    LibXNDR glyph set. 24×24 grid, flat fills only.
    Main silhouette = currentColor. Shading = currentColor at reduced opacity.
    Fixed accents read CSS custom properties so a page can retint them:
      --g-gold   (default #e3b341)   --g-lapis (default #2f54a8)
      --g-bg     (default #07070a)   knock-out details (eyes, text lines)
  -->

  <!-- Pyramid: lit left face, shaded right face, bright capstone. -->
  <symbol id="g-pyramid" viewBox="0 0 24 24">
    <polygon points="1.5,22 12,2.5 12,22" fill="currentColor"/>
    <polygon points="12,2.5 22.5,22 12,22" fill="currentColor" opacity=".55"/>
    <polygon points="12,2.5 10.2,5.8 13.8,5.8" fill="var(--g-bg,#07070a)" opacity=".85"/>
    <polygon points="12,1 9.6,5.4 14.4,5.4" fill="var(--g-gold,#e3b341)"/>
    <rect x="1" y="22" width="22" height="1.4" fill="currentColor" opacity=".35"/>
  </symbol>

  <!-- Wedjat, the Eye of Horus: brow, almond eye, lapis iris, tear line and curl. -->
  <symbol id="g-eye" viewBox="0 0 24 24">
    <path d="M2.5 6.6 Q12 1.8 21.5 6.6 L21.5 8.6 Q12 4.4 2.5 8.6 Z" fill="currentColor"/>
    <path d="M2.5 12.2 Q12 5.6 21.5 12.2 Q12 18.4 2.5 12.2 Z" fill="currentColor"/>
    <path d="M5 12.2 Q12 7.9 19 12.2 Q12 16.3 5 12.2 Z" fill="var(--g-bg,#07070a)"/>
    <circle cx="12" cy="12.2" r="2.9" fill="var(--g-lapis,#2f54a8)"/>
    <circle cx="12" cy="12.2" r="1.1" fill="var(--g-bg,#07070a)"/>
    <rect x="11.1" y="15.2" width="1.8" height="7" fill="currentColor"/>
    <path d="M4.2 14.4 L6.2 14.4 L7.4 18.6 Q8 20.4 10 20.8 L10 22.6 Q6.6 22.2 5.7 19.2 Z" fill="currentColor"/>
    <path d="M16.6 15.6 L21.6 19 L21.6 20.8 L15.8 17.2 Z" fill="currentColor" opacity=".55"/>
  </symbol>

  <!-- Ibis of Thoth: long curved beak, round head, body block, two legs. -->
  <symbol id="g-ibis" viewBox="0 0 24 24">
    <ellipse cx="10.5" cy="15" rx="7" ry="4.6" fill="currentColor"/>
    <path d="M13.6 11.2 Q13.4 6.2 16.4 4.4 L17.8 5.4 Q15.4 7 15.6 11.6 Z" fill="currentColor"/>
    <circle cx="17.2" cy="4.6" r="2.3" fill="currentColor"/>
    <path d="M19 3.8 Q23 4.6 22.6 11.4 L21.4 11.4 Q21.4 6.2 18.6 5.4 Z" fill="currentColor"/>
    <circle cx="17.8" cy="4.2" r=".6" fill="var(--g-bg,#07070a)"/>
    <rect x="7.6" y="19" width="1.4" height="4.4" fill="currentColor"/>
    <rect x="12" y="19" width="1.4" height="4.4" fill="currentColor"/>
    <path d="M3.6 15.6 Q2 17 1.2 19.4 L2.6 19.6 Q3.4 17.6 5 16.6 Z" fill="currentColor" opacity=".6"/>
  </symbol>

  <!-- Papyrus scroll: two rolled ends, a sheet with lines of text. -->
  <symbol id="g-scroll" viewBox="0 0 24 24">
    <rect x="1.5" y="4.5" width="4" height="15" rx="2" fill="currentColor"/>
    <rect x="18.5" y="4.5" width="4" height="15" rx="2" fill="currentColor"/>
    <rect x="6.3" y="5.6" width="11.4" height="12.8" fill="currentColor" opacity=".72"/>
    <rect x="8.2" y="8.4" width="7.6" height="1.3" fill="var(--g-bg,#07070a)"/>
    <rect x="8.2" y="11.3" width="7.6" height="1.3" fill="var(--g-bg,#07070a)"/>
    <rect x="8.2" y="14.2" width="5" height="1.3" fill="var(--g-bg,#07070a)"/>
    <circle cx="3.5" cy="5.4" r=".9" fill="var(--g-bg,#07070a)"/>
    <circle cx="20.5" cy="5.4" r=".9" fill="var(--g-bg,#07070a)"/>
  </symbol>

  <!-- Ankh: loop, crossbar, stem. -->
  <symbol id="g-ankh" viewBox="0 0 24 24">
    <path fill-rule="evenodd" fill="currentColor" d="M12 1.2 C15.2 1.2 17.4 3.9 17.4 7 C17.4 9.7 15.3 12.2 12 12.2 C8.7 12.2 6.6 9.7 6.6 7 C6.6 3.9 8.8 1.2 12 1.2 Z M12 3.8 C10.3 3.8 9.2 5.3 9.2 7 C9.2 8.6 10.4 9.8 12 9.8 C13.6 9.8 14.8 8.6 14.8 7 C14.8 5.3 13.7 3.8 12 3.8 Z"/>
    <rect x="3.5" y="11.6" width="17" height="2.8" fill="currentColor"/>
    <rect x="10.6" y="11.6" width="2.8" height="11.4" fill="currentColor"/>
  </symbol>

  <!-- Scarab holding the sun disk. -->
  <symbol id="g-scarab" viewBox="0 0 24 24">
    <circle cx="12" cy="3.6" r="2.6" fill="var(--g-gold,#e3b341)"/>
    <path d="M8.2 7.6 L5.4 4.4 L6.6 3.6 L9.6 7.2 Z" fill="currentColor"/>
    <path d="M15.8 7.6 L18.6 4.4 L17.4 3.6 L14.4 7.2 Z" fill="currentColor"/>
    <path d="M8.4 9.4 Q12 5.4 15.6 9.4 Z" fill="currentColor"/>
    <rect x="7.6" y="9" width="8.8" height="3.4" rx="1.2" fill="currentColor"/>
    <ellipse cx="12" cy="17.2" rx="5.6" ry="5.8" fill="currentColor"/>
    <rect x="11.5" y="12.6" width="1" height="10.2" fill="var(--g-bg,#07070a)"/>
    <rect x="6.8" y="12.1" width="10.4" height=".9" fill="var(--g-bg,#07070a)"/>
    <path d="M6.6 14.6 L2.6 13.2 L2.2 14.4 L6.2 16 Z" fill="currentColor" opacity=".7"/>
    <path d="M17.4 14.6 L21.4 13.2 L21.8 14.4 L17.8 16 Z" fill="currentColor" opacity=".7"/>
    <path d="M7 19.4 L3.6 21.6 L4.4 22.6 L7.8 20.6 Z" fill="currentColor" opacity=".7"/>
    <path d="M17 19.4 L20.4 21.6 L19.6 22.6 L16.2 20.6 Z" fill="currentColor" opacity=".7"/>
  </symbol>

  <!-- Feather of Ma'at: tall plume with a curled tip, two vanes. -->
  <symbol id="g-feather" viewBox="0 0 24 24">
    <path d="M11 22 L11 5 Q11 1.6 14.2 1.8 Q16.6 2.2 16 4.6 Q15.4 3.4 14 3.6 Q12.8 4 12.8 5.4 L12.8 22 Z" fill="currentColor"/>
    <path d="M11 20.4 Q5.2 17.6 5.8 8.8 Q6.2 5.2 11 4.8 Z" fill="currentColor" opacity=".55"/>
    <path d="M12.8 20.4 Q18.6 17.6 18 8.8 Q17.6 5.2 12.8 4.8 Z" fill="currentColor" opacity=".82"/>
    <rect x="6.6" y="10" width="4" height=".9" fill="var(--g-bg,#07070a)" opacity=".7"/>
    <rect x="6.9" y="13.4" width="3.8" height=".9" fill="var(--g-bg,#07070a)" opacity=".7"/>
    <rect x="13.2" y="10" width="4" height=".9" fill="var(--g-bg,#07070a)" opacity=".7"/>
    <rect x="13.2" y="13.4" width="3.8" height=".9" fill="var(--g-bg,#07070a)" opacity=".7"/>
  </symbol>

  <!-- Cartouche: the rope ring that frames a royal name. -->
  <symbol id="g-cartouche" viewBox="0 0 24 24">
    <path fill-rule="evenodd" fill="currentColor" d="M12 1 A8 8 0 0 1 20 9 L20 12.4 A8 8 0 0 1 4 12.4 L4 9 A8 8 0 0 1 12 1 Z M12 3.2 A5.8 5.8 0 0 0 6.2 9 L6.2 12.4 A5.8 5.8 0 0 0 17.8 12.4 L17.8 9 A5.8 5.8 0 0 0 12 3.2 Z"/>
    <rect x="4" y="21" width="16" height="2.2" fill="currentColor"/>
  </symbol>

  <!-- Djed pillar: stability. Four stacked crossbars over a widening column. -->
  <symbol id="g-djed" viewBox="0 0 24 24">
    <rect x="5" y="1.6" width="14" height="2.3" rx=".6" fill="currentColor"/>
    <rect x="5.6" y="5.1" width="12.8" height="2.3" rx=".6" fill="currentColor"/>
    <rect x="6.2" y="8.6" width="11.6" height="2.3" rx=".6" fill="currentColor"/>
    <rect x="6.8" y="12.1" width="10.4" height="2.3" rx=".6" fill="currentColor"/>
    <path d="M9.4 14.4 L14.6 14.4 L15.6 21 L8.4 21 Z" fill="currentColor" opacity=".8"/>
    <rect x="5.5" y="21" width="13" height="2.2" fill="currentColor"/>
  </symbol>

  <!-- Sun of Ra with the uraeus cobra. -->
  <symbol id="g-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="10.4" r="7" fill="var(--g-gold,#e3b341)"/>
    <circle cx="12" cy="10.4" r="7.9" fill="var(--g-gold,#e3b341)" opacity=".28"/>
    <path d="M9.2 14.2 Q6.6 15.8 7.6 19.2 Q8.4 21.8 12 22.6 Q14.8 22.2 14.2 19.6 L12.6 20 Q12.9 21 11.6 21.1 Q9.6 20.6 9.3 18.6 Q9 16.6 11.3 15.6 Z" fill="currentColor"/>
    <ellipse cx="10.2" cy="14.4" rx="2" ry="1.3" fill="currentColor"/>
  </symbol>

  <!-- Lotus: three petals on a stem. Rebirth, the south. -->
  <symbol id="g-lotus" viewBox="0 0 24 24">
    <path d="M12 1.6 Q15.4 6 14.2 13.2 L9.8 13.2 Q8.6 6 12 1.6 Z" fill="currentColor"/>
    <path d="M4.6 5.2 Q9.6 7.2 10.4 13.2 L7.6 13.2 Q4 10.4 4.6 5.2 Z" fill="currentColor" opacity=".62"/>
    <path d="M19.4 5.2 Q14.4 7.2 13.6 13.2 L16.4 13.2 Q20 10.4 19.4 5.2 Z" fill="currentColor" opacity=".62"/>
    <path d="M7.4 13.6 L16.6 13.6 L15.4 16.4 L8.6 16.4 Z" fill="currentColor"/>
    <rect x="11.2" y="16.4" width="1.6" height="6.4" fill="currentColor"/>
  </symbol>

  <!-- Owl, the letter m. Faces the reader, which almost no other hieroglyph does. -->
  <symbol id="g-owl" viewBox="0 0 24 24">
    <path d="M6.6 3.2 L8.6 5.2 L15.4 5.2 L17.4 3.2 L17.4 10.6 L6.6 10.6 Z" fill="currentColor"/>
    <path d="M6.6 10.6 L17.4 10.6 L17.4 18.2 Q17.4 21.8 12 22.4 Q6.6 21.8 6.6 18.2 Z" fill="currentColor" opacity=".8"/>
    <circle cx="9.7" cy="7.6" r="1.8" fill="var(--g-bg,#07070a)"/>
    <circle cx="14.3" cy="7.6" r="1.8" fill="var(--g-bg,#07070a)"/>
    <circle cx="9.7" cy="7.6" r=".8" fill="var(--g-gold,#e3b341)"/>
    <circle cx="14.3" cy="7.6" r=".8" fill="var(--g-gold,#e3b341)"/>
    <polygon points="12,8.9 11,10.4 13,10.4" fill="var(--g-bg,#07070a)"/>
    <rect x="9.4" y="13.2" width="1.2" height="5" fill="var(--g-bg,#07070a)" opacity=".5"/>
    <rect x="13.4" y="13.2" width="1.2" height="5" fill="var(--g-bg,#07070a)" opacity=".5"/>
    <rect x="8.6" y="22" width="2.6" height="1.6" fill="currentColor"/>
    <rect x="12.8" y="22" width="2.6" height="1.6" fill="currentColor"/>
  </symbol>

  <!-- Flowering reed, the letter i. -->
  <symbol id="g-reed" viewBox="0 0 24 24">
    <path d="M12 .8 Q16.6 4.2 14.6 10.4 L9.4 10.4 Q7.4 4.2 12 .8 Z" fill="currentColor"/>
    <rect x="11.5" y="2.8" width="1" height="6.6" fill="var(--g-bg,#07070a)" opacity=".7"/>
    <rect x="11.2" y="10.4" width="1.6" height="12.8" fill="currentColor"/>
    <path d="M12.8 15 Q16 14.6 17.4 17.2 Q14.6 17.6 12.8 16.4 Z" fill="currentColor" opacity=".6"/>
  </symbol>

  <!-- Water, the letter n. Two ribbons of ripples. -->
  <symbol id="g-water" viewBox="0 0 24 24">
    <path d="M1.5 9.6 L4.8 6.3 L8.1 9.6 L11.4 6.3 L14.7 9.6 L18 6.3 L21.3 9.6 L22.5 8.4 L22.5 10.9 L21.3 12.1 L18 8.8 L14.7 12.1 L11.4 8.8 L8.1 12.1 L4.8 8.8 L1.5 12.1 Z" fill="currentColor"/>
    <path d="M1.5 16.6 L4.8 13.3 L8.1 16.6 L11.4 13.3 L14.7 16.6 L18 13.3 L21.3 16.6 L22.5 15.4 L22.5 17.9 L21.3 19.1 L18 15.8 L14.7 19.1 L11.4 15.8 L8.1 19.1 L4.8 15.8 L1.5 19.1 Z" fill="currentColor" opacity=".6"/>
  </symbol>

  <!-- Fallen pyramid, for pages that went missing. -->
  <symbol id="g-pyramid-fallen" viewBox="0 0 24 24">
    <g transform="rotate(-34 11 15)">
      <polygon points="2,20 11,4 11,20" fill="currentColor"/>
      <polygon points="11,4 20,20 11,20" fill="currentColor" opacity=".55"/>
      <polygon points="11,4 9.5,6.8 12.5,6.8" fill="var(--g-bg,#07070a)" opacity=".85"/>
    </g>
    <polygon points="20.4,18.2 18.2,22 22.6,22" fill="var(--g-gold,#e3b341)"/>
    <rect x="1" y="22" width="22" height="1.4" fill="currentColor" opacity=".35"/>
  </symbol>

  <!-- Open book, used only where a cover is missing. -->
  <symbol id="g-book" viewBox="0 0 24 24">
    <path d="M2 4.6 Q7 3.2 11.2 5.6 L11.2 20.4 Q7 18.2 2 19.6 Z" fill="currentColor"/>
    <path d="M22 4.6 Q17 3.2 12.8 5.6 L12.8 20.4 Q17 18.2 22 19.6 Z" fill="currentColor" opacity=".7"/>
    <rect x="4.2" y="8" width="5" height="1.1" fill="var(--g-bg,#07070a)"/>
    <rect x="4.2" y="11" width="5" height="1.1" fill="var(--g-bg,#07070a)"/>
    <rect x="14.8" y="8" width="5" height="1.1" fill="var(--g-bg,#07070a)"/>
    <rect x="14.8" y="11" width="5" height="1.1" fill="var(--g-bg,#07070a)"/>
  </symbol>
</svg>
